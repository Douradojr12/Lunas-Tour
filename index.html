<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Excursões de ônibus com hotel, roteiro e parcelamento. Reserve pelo WhatsApp."><meta property="og:type" content="website"><meta property="og:title" content="Lunas Tour · Agência de viagens"><meta property="og:description" content="É preciso viver, e a Lunas Tour leva você! Excursões com hotel, roteiro e parcelamento."><meta property="og:image" content="https://douradojr12.github.io/Lunas-Tour/fotos/gramado1.jpg"><meta property="og:url" content="https://douradojr12.github.io/Lunas-Tour/"><meta name="theme-color" content="#0A7FC0"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Lunas Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Cinzel:wght@600;700&family=Caveat:wght@600;700&display=swap">
<style id="app-style">
/* Layout: an ocean-and-sun travel desk. Photo stages carry the emotion; boarding-pass stubs carry dates, seats and times. */
:root{
  --bg:#EFF6FA; --surface:#FFFFFF; --surface-2:#E1EEF5; --ink:#0B2236; --muted:#4D6A7E; --line:#CCDFEA;
  --brand:#0A7FC0; --brand-ink:#FFFFFF; --cyan:#17BFE6; --accent:#FFB531; --accent-ink:#2B1A00;
  --danger:#C23B2A; --ok:#14865A; --wa:#178F4C; --wa-ink:#FFFFFF; --photo-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(11,34,54,.06),0 12px 32px -14px rgba(11,34,54,.28);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-brand:"Cinzel","Trajan Pro",Georgia,serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#06131D; --surface:#0D2131; --surface-2:#143049; --ink:#E2F0F8; --muted:#8EAEC2; --line:#1F3D53;
  --brand:#3DB6F0; --brand-ink:#02182A; --cyan:#4FD7F3; --accent:#FFC14F; --accent-ink:#241500;
  --danger:#F2826E; --ok:#4FCB92; --wa:#2FBF6E; --wa-ink:#03200F; --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -14px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#06131D; --surface:#0D2131; --surface-2:#143049; --ink:#E2F0F8; --muted:#8EAEC2; --line:#1F3D53;
  --brand:#3DB6F0; --brand-ink:#02182A; --cyan:#4FD7F3; --accent:#FFC14F; --accent-ink:#241500;
  --danger:#F2826E; --ok:#4FCB92; --wa:#2FBF6E; --wa-ink:#03200F; --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -14px rgba(0,0,0,.7); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.hand{font-family:var(--f-hand);font-weight:700}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.logo-mark{width:48px;height:48px;border-radius:50%;flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 4px 14px -4px rgba(10,127,192,.6);transition:transform .6s var(--ease)}
.logo:hover .logo-mark{transform:rotate(-12deg) scale(1.06)}
.logo-mark svg,.logo-mark img{width:100%;height:100%;display:block;object-fit:cover}
.logo-txt{display:grid;line-height:1}
.logo-txt b{font-family:var(--f-brand);font-size:21px;letter-spacing:.04em}
.logo-txt span{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;padding:8px 12px;border-radius:999px;transition:background .2s}
.nav a:hover{background:var(--surface-2)}
.nav a.cta{background:var(--accent);color:var(--accent-ink)}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.2;transition:transform .2s var(--ease),filter .2s,box-shadow .2s;overflow:hidden;isolation:isolate}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-brand{background:var(--brand);color:var(--brand-ink);box-shadow:0 10px 24px -12px var(--brand)}
.btn-accent{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -12px var(--accent)}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-glass{background:rgba(255,255,255,.16);color:var(--photo-ink);border:1.5px solid rgba(255,255,255,.45);backdrop-filter:blur(8px)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn-sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn-accent::after,.btn-brand::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.btn-accent:hover::after,.btn-brand:hover::after{transform:translateX(120%)}

.hero{padding-block:18px 8px}
.stage{position:relative;border-radius:28px;overflow:hidden;min-height:clamp(480px,66vh,660px);background:#0B2236;isolation:isolate;box-shadow:var(--shadow)}
.slide{position:absolute;inset:-4%;opacity:0;transition:opacity 1.4s ease;transform:translate3d(calc(var(--px,0)*-18px),calc(var(--py,0)*-12px),0)}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
.slide.on{opacity:1}
.slide.on img{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.18) translate(-1.5%,1%)}to{transform:scale(1.04) translate(0,0)}}
.stage::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(4,18,30,.8) 0%,rgba(4,18,30,.38) 55%,rgba(4,18,30,.08) 100%),linear-gradient(0deg,rgba(4,18,30,.6),transparent 45%)}
.stage-in{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:end;min-height:inherit;padding:clamp(22px,4vw,48px)}
.hero-copy{color:var(--photo-ink);display:grid;gap:14px;align-self:center;max-width:640px}
.chip-ph{display:inline-flex;gap:8px;align-items:center;width:fit-content;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--photo-ink)}
.hero-copy h1{font-size:clamp(40px,6.6vw,80px);font-weight:800;line-height:.98}
.hero-copy .hand{font-size:clamp(30px,4.4vw,52px);color:var(--accent);line-height:1;transform:rotate(-2deg);transform-origin:left}
.hero-copy p.lead{font-size:18px;opacity:.9;max-width:46ch}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.rise{animation:rise .9s var(--ease) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hero-side{display:grid;gap:14px;justify-items:end;align-self:stretch;align-content:space-between}
.side-low{display:grid;gap:12px;justify-items:inherit;width:100%}
.badge-logo{width:clamp(110px,14vw,170px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);animation:float 6s ease-in-out infinite;max-width:100%}
.badge-logo svg,.badge-logo img{width:100%;height:100%;display:block;object-fit:cover}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dot{border:0;background:rgba(255,255,255,.16);color:var(--photo-ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px);position:relative;overflow:hidden}
.dot.on{background:rgba(255,255,255,.3)}
.dot.on::after{content:"";position:absolute;left:0;bottom:0;height:2px;background:var(--accent);animation:prog 6s linear both}
@keyframes prog{from{width:0}to{width:100%}}
.plane{position:absolute;z-index:2;top:12%;left:-60px;color:rgba(255,255,255,.85);animation:fly 16s linear infinite;pointer-events:none}
@keyframes fly{0%{transform:translate(0,40px) rotate(-8deg)}100%{transform:translate(calc(100vw + 120px),-60px) rotate(-8deg)}}
.marquee{overflow:hidden;padding-block:18px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-in{display:flex;gap:28px;width:max-content;animation:mq 40s linear infinite}
.marquee span{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--muted);white-space:nowrap;display:flex;gap:28px;align-items:center}
.marquee span i{width:8px;height:8px;border-radius:50%;background:var(--cyan);display:block}
@keyframes mq{to{transform:translateX(-50%)}}

.pass{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);color:var(--ink)}
.pass-head{background:linear-gradient(110deg,var(--brand),var(--cyan));color:var(--brand-ink);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pass-head .eyebrow{color:inherit;opacity:.9}
.pass-body{padding:16px 18px;display:grid;gap:12px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.route .pt{min-width:0}
.route .pt b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1}
.route .pt span{font-size:13px;color:var(--muted)}
.route .pt:last-child{text-align:right}
.route .bus{color:var(--brand);position:relative;width:86px;height:24px}
.route .bus::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--line)}
.route .bus svg{position:absolute;top:0;left:0;animation:drive 3.6s var(--ease) infinite alternate;background:var(--surface)}
@keyframes drive{from{left:0}to{left:calc(100% - 22px)}}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 -18px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.perf::before{left:-10px}.perf::after{right:-10px}
.stub{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stub div{min-width:0}
.stub small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
.stub b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.hero-pass{width:min(360px,100%);transition:transform .4s var(--ease)}
.hero-pass:hover{transform:translateY(-4px) rotate(-1deg)}
.stage .pass .perf::before,.stage .pass .perf::after{background:#0B2236}

section.block{padding-block:28px 36px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{font-size:clamp(28px,3.6vw,40px);font-weight:800}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;transition:all .25s var(--ease)}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-width:0;width:220px;max-width:100%}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;perspective:1200px}
.card{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1px solid var(--line);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);transition:transform .5s var(--ease),box-shadow .3s;transform-style:preserve-3d}
.card.tilt{transition:transform .08s linear,box-shadow .3s}
.card:hover{box-shadow:0 30px 60px -24px rgba(11,34,54,.5)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(600px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.22),transparent 40%);opacity:0;transition:opacity .3s}
.card:hover::after{opacity:1}
.card-img{position:relative;aspect-ratio:16/10;background:var(--surface-2);max-width:100%;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.card:hover .card-img img{transform:scale(1.09)}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink);line-height:1.3}
.badge.hot{background:var(--accent);color:var(--accent-ink)}
.badge.off{background:var(--ink);color:var(--bg)}
.badge.ex{background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);backdrop-filter:blur(4px)}
.count-tag{position:absolute;bottom:10px;right:10px;font-family:var(--f-mono);font-size:12px;font-weight:600;background:rgba(4,18,30,.7);color:var(--photo-ink);padding:4px 9px;border-radius:8px;backdrop-filter:blur(4px)}
.card-body{padding:16px 16px 12px;display:grid;gap:6px;flex:1;align-content:start}
.card-body h3{font-size:21px;font-weight:700}
.card-body .dest{font-size:14px;color:var(--muted)}
.card-stub{border-top:2px dashed var(--line);padding:12px 16px 14px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.card-stub .when{font-family:var(--f-mono);font-size:13px;line-height:1.5}
.price{text-align:right}
.price small{display:block;font-size:12px;color:var(--muted)}
.price b{font-family:var(--f-display);font-size:23px;line-height:1.1}
.price span{display:block;font-size:12.5px;color:var(--brand);font-weight:700}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
@supports (animation-timeline: view()){
  .reveal{animation:revealIn linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
  @keyframes revealIn{from{opacity:.25;transform:translateY(46px) scale(.96)}to{opacity:1;transform:none}}
}

.custom-band{position:relative;overflow:hidden;background:linear-gradient(120deg,#0B2236,#0A4F7A 60%,#0A7FC0);color:var(--photo-ink);border-radius:24px;padding:clamp(22px,4vw,40px);display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.custom-band::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-160px;background:radial-gradient(circle,#FFB531,transparent 65%);opacity:.35;animation:sun 9s ease-in-out infinite alternate}
@keyframes sun{to{transform:translate(-60px,40px) scale(1.15)}}
.custom-band>*{position:relative}
.custom-band h2{font-size:clamp(26px,3.2vw,38px)}
.custom-band p{opacity:.85;margin-top:8px;max-width:58ch}
.faq{display:grid;gap:10px;max-width:860px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px;transition:background .3s}
.faq details[open]{background:var(--surface-2)}
.faq summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;color:var(--brand);transition:transform .35s var(--ease);flex:none}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:14px;color:var(--muted);white-space:pre-line;animation:rise .45s var(--ease) both}

footer{border-top:1px solid var(--line);margin-top:40px;background:var(--surface)}
footer .wrap{padding-block:26px 36px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
footer a{color:var(--muted)}
.credits{font-size:12.5px;max-width:620px}
.credits ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;background:var(--wa);color:var(--wa-ink);display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.45)}
.fab::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--wa);animation:ping 2.2s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}

.back{display:inline-flex;align-items:center;gap:6px;margin-block:16px 12px;font-weight:600;text-decoration:none;color:var(--muted)}
.d-hero{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:21/9;background:#0B2236;max-width:100%;cursor:zoom-in;isolation:isolate}
.d-hero .layer{position:absolute;inset:0}
.d-hero .layer img{width:100%;height:100%;object-fit:cover;display:block}
.d-hero .layer.kb img{animation:kb 12s ease-out both}
.d-hero::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(4,18,30,.8),rgba(4,18,30,.1) 55%,transparent);pointer-events:none}
.d-hero-txt{position:absolute;z-index:3;left:clamp(16px,3vw,32px);right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,28px);color:var(--photo-ink);display:grid;gap:8px;pointer-events:none}
.d-hero-txt h1{font-size:clamp(28px,5vw,60px);font-weight:800}
.d-hero-txt .eyebrow{color:rgba(255,255,255,.85)}
.d-hero .zoom{position:absolute;z-index:3;top:14px;right:14px;background:rgba(4,18,30,.55);color:var(--photo-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;backdrop-filter:blur(6px);pointer-events:none}
.d-hero .credit{position:absolute;z-index:3;top:16px;left:16px;font-size:11px;color:rgba(255,255,255,.8);max-width:55%;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 6px}
.thumbs button{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;width:104px;height:70px;flex:none;cursor:pointer;background:var(--surface-2);transition:transform .35s var(--ease),box-shadow .35s}
.thumbs button:hover{transform:translateY(-3px) scale(1.04)}
.thumbs button[aria-current="true"]{box-shadow:0 0 0 3px var(--accent);transform:translateY(-3px)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.detail{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px}
.panel h3{font-size:20px}
.stack{display:grid;gap:18px}

function startHero(){
  var st=document.getElementById('stage');if(!st)return;
  var slides=[].slice.call(st.querySelectorAll('.slide')),dots=[].slice.call(st.querySelectorAll('.dot')),cur=0;
  function show(i){
    cur=(i+slides.length)%slides.length;
    slides.forEach(function(s,k){s.classList.toggle('on',k===cur);if(k===cur){var im=s.querySelector('img');im.style.animation='none';void im.offsetWidth;im.style.animation=''}});
    dots.forEach(function(d,k){d.classList.remove('on');if(k===cur){void d.offsetWidth;d.classList.add('on')}});
  }
  st._show=function(i){show(i);clearTimers();if(slides.length>1&&!RM)timers.push(setInterval(function(){if(!document.hidden)show(cur+1)},6000))};
  if(slides.length>1&&!RM)timers.push(setInterval(function(){if(!document.hidden)show(cur+1)},6000));
  if(!RM)st.addEventListener('pointermove',function(ev){var r=st.getBoundingClientRect();st.style.setProperty('--px',((ev.clientX-r.left)/r.width-.5).toFixed(3));st.style.setProperty('--py',((ev.clientY-r.top)/r.height-.5).toFixed(3))});
}

function openLightbox(list,start,title,cx,cy){
  if(!list||!list.length)return;var i=start;
  var lb=document.createElement('div');lb.className='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');lb.setAttribute('aria-label','Fotos de '+title);
  lb.innerHTML='<div class="lb-top"><b>'+h(title)+'</b><button class="lb-x" type="button">Fechar ✕</button></div><div class="lb-stage">'+(list.length>1?'<button class="lb-btn lb-prev" type="button" aria-label="Foto anterior">‹</button><button class="lb-btn lb-next" type="button" aria-label="Próxima foto">›</button>':'')+'</div>'+
    '<div class="lb-foot"><div class="lb-cap"><span class="mono lb-count"></span><span class="lb-credit"></span></div>'+(list.length>1?'<div class="lb-strip">'+list.map(function(im,k){return '<button type="button" data-k="'+k+'" aria-label="Foto '+(k+1)+'"><img src="'+h(imgSrc(im))+'" alt=""></button>'}).join('')+'</div>':'')+'</div>';
  document.body.appendChild(lb);document.body.style.overflow='hidden';
  var stage=lb.querySelector('.lb-stage'),anim=!RM&&!!lb.animate;
  function put(k,dir){
    var nxt=(k+list.length)%list.length,lyr=document.createElement('div');lyr.className='lyr';lyr.innerHTML='<img src="'+h(imgSrc(list[nxt]))+'" alt="">';
    var old=[].slice.call(stage.querySelectorAll('.lyr'));stage.insertBefore(lyr,stage.firstChild);i=nxt;
    lb.querySelector('.lb-count').textContent=(i+1)+' / '+list.length;lb.querySelector('.lb-credit').textContent=credit(list[i]);
    lb.querySelectorAll('.lb-strip button').forEach(function(b){b.setAttribute('aria-current',String(+b.dataset.k===i))});
    if(!anim||!dir){old.forEach(function(o){o.remove()});return}
    stage.insertBefore(lyr,old[old.length-1].nextSibling);
    lyr.animate([{clipPath:dir>0?'inset(0 0 0 100%)':'inset(0 100% 0 0)',transform:'scale(1.12)'},{clipPath:'inset(0 0 0 0)',transform:'scale(1)'}],{duration:850,easing:'cubic-bezier(.7,0,.2,1)'});
    old.forEach(function(o){o.animate([{transform:'translateX(0) scale(1)',opacity:1},{transform:'translateX('+(-dir*12)+'%) scale(.9)',opacity:0}],{duration:850,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'}).onfinish=function(){o.remove()}});
  }
  put(i,0);
  var at=(cx!=null?Math.round(cx)+'px '+Math.round(cy)+'px':'50% 50%');
  if(anim){lb.animate([{clipPath:'circle(0px at '+at+')'},{clipPath:'circle(150vmax at '+at+')'}],{duration:800,easing:'cubic-bezier(.7,0,.2,1)'});
    var fi=stage.querySelector('.lyr img');if(fi)fi.animate([{transform:'scale(1.3)',filter:'blur(14px)'},{transform:'scale(1)',filter:'blur(0px)'}],{duration:1100,easing:'cubic-bezier(.16,1,.3,1)'})}
  function close(){
    document.removeEventListener('keydown',key);document.body.style.overflow='';
    if(!anim){lb.remove();return}
    lb.animate([{clipPath:'circle(150vmax at '+at+')'},{clipPath:'circle(0px at '+at+')'}],{duration:600,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'}).onfinish=function(){lb.remove()};
  }
  function key(ev){if(ev.key==='Escape')close();else if(ev.key==='ArrowRight')put(i+1,1);else if(ev.key==='ArrowLeft')put(i-1,-1)}
  document.addEventListener('keydown',key);
  lb.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t)return;
    if(t.classList.contains('lb-x'))close();else if(t.classList.contains('lb-next'))put(i+1,1);else if(t.classList.contains('lb-prev'))put(i-1,-1);else if(t.dataset.k!=null){var k=+t.dataset.k;if(k!==i)put(k,k>i?1:-1)}});
  var sx=null;stage.addEventListener('pointerdown',function(ev){sx=ev.clientX});
  stage.addEventListener('pointerup',function(ev){if(sx==null)return;var dx=ev.clientX-sx;sx=null;if(Math.abs(dx)>50&&list.length>1)put(i+(dx<0?1:-1),dx<0?1:-1)});
  lb.querySelector('.lb-x').focus();
}

function authed(){if(DEMO)return true;return !!(S.admin&&ss('adm')===S.admin.hash)}
async function hashPw(login,pw,salt){
  var data=new TextEncoder().encode(salt+'|'+login.trim().toLowerCase()+'|'+pw);
  try{var buf=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}
  catch(e){var x=5381;for(var i=0;i<data.length;i++)x=((x<<5)+x+data[i])>>>0;return 'f'+x.toString(16)}
}

function readDraft(){
  var d=ui.draft;if(!d)return;
  var g=function(id){var el=document.getElementById(id);return el?el.value:undefined};
  var set=function(obj,k,id,fn){var x=g(id);if(x!==undefined)obj[k]=fn?fn(x):x.trim()};
  set(d,'titulo','e-titulo');set(d,'destino','e-destino');set(d,'categoria','e-cat');set(d,'status','e-status');set(d,'transporte','e-transp');
  set(d,'resumo','e-resumo');set(d,'descricao','e-desc');var cb=document.getElementById('e-dest');if(cb)d.destaque=cb.checked;
  set(d.ida,'data','e-ida-d');set(d.ida,'hora','e-ida-h');set(d.ida,'local','e-ida-l');set(d.volta,'data','e-vol-d');set(d.volta,'hora','e-vol-h');set(d.volta,'local','e-vol-l');
  set(d.hotel,'nome','h-nome');set(d.hotel,'estrelas','h-est',function(x){return parseInt(x,10)||0});set(d.hotel,'quarto','h-quarto');set(d.hotel,'descricao','h-desc');
  set(d.hotel,'comodidades','h-com',function(x){return x.split(',').map(function(s){return s.trim()}).filter(Boolean)});
  set(d,'roteiro','e-rot');set(d,'inclui','e-inc');set(d,'naoInclui','e-ninc');
  var v=d.valores;set(v,'adulto','v-ad',numIn);set(v,'crianca','v-cr',numIn);set(v,'criancaIdade','v-cri');set(v,'pixDesconto','v-pix',numIn);set(v,'entrada','v-ent',numIn);
  set(v,'parcelas','v-par',function(x){return Math.max(1,parseInt(x,10)||1)});set(v,'semJuros','v-sj',function(x){return Math.max(1,parseInt(x,10)||1)});set(v,'juros','v-jr',numIn);set(v,'obs','v-obs');
  set(d.vagas,'total','g-tot',function(x){return Math.max(0,Math.min(80,parseInt(x,10)||0))});
  d.ocupadas=(d.ocupadas||[]).filter(function(n){return n<=d.vagas.total});
  set(d,'obs','e-obs');
}

/* ---------- uploads ---------- */
function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){res({im:im,u:u})};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
async function shrink(file,max,q,type){
  var o=await loadImg(file),im=o.im,s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  var c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(o.u);
  return new Promise(function(res){c.toBlob(function(b){res({blob:b,dataUrl:b?null:c.toDataURL(type||'image/jpeg',q)})},type||'image/jpeg',q)});
}
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
async function toStored(file,max,q,type){
  if(caps.assets){var r=await shrink(file,max,q,type);var up=await caps.assets.upload(r.blob);return {url:up.url,id:up.id}}
  var r2=await shrink(file,Math.min(max,1100),.72,type);return {url:r2.dataUrl||await blobToDataUrl(r2.blob)};
}
async function addImages(key,files){
  if(key==='logo'){
    ui.uploading='logo';render();
    try{var lg=await toStored(files[0],600,.9,'image/png');var n=clone(S);n.config.logo=lg;ui.uploading=null;persist(n,'Logo atualizada.')}
    catch(e){ui.uploading=null;ui.err='Não foi possível enviar a logo. Tente um arquivo JPG ou PNG menor.';render()}
    return;
  }
  readDraft();ui.uploading=key;ui.err='';rerenderImgs(key);
  var arr=key==='main'?ui.draft.imagens:ui.draft.hotel.imagens,fail=0;
  for(var i=0;i<files.length;i++){try{arr.push(await toStored(files[i],1600,.82))}catch(e){fail++}rerenderImgs(key)}
  ui.uploading=null;rerenderImgs(key);
  if(fail){ui.err=fail+' foto(s) não puderam ser enviadas. Tente um arquivo JPG ou PNG menor.';render()}
  var sb=document.querySelector('[data-act="save-ex"]');if(sb)sb.disabled=false;
}

function resetCss(){
  var st=[].slice.call(document.head.querySelectorAll('style')).map(function(s){return s.textContent}).filter(function(t){return t.indexOf('safe-area')>=0})[0];
  return st||':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
}
function buildDoc(state){
  var css=document.getElementById('app-style').textContent,js=document.getElementById('app-js').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+resetCss()+'</style></head><body>'+
    HEAD_BITS+'<style id="app-style">'+css+'</style>\n<div id="app"></div>\n<script id="state" type="application/json">'+json+SCRIPT_END+'\n<script id="app-js">'+js+SCRIPT_END+'</body></html>';
}
async function persist(next,toast,after){
  if(DEMO){S=next;ui.err='';render();showToast('Apresentação: a mudança aparece agora, mas some ao recarregar a página.');return}
  ui.saving=true;ui.err='';render();
  try{
    var art=caps.artifact||(window.claude&&claude.use?await claude.use('artifact'):null);
    if(!art)throw {code:'unavailable'};
    var html=buildDoc(next);
    if(html.length>15e6)throw {code:'too_big'};
    ss('toast',toast);if(after)ss('after',after);
    await art.publish(html);
    S=next;ui.saving=false;render();showToast(toast);ss('toast',null);
  }catch(e){
    ss('toast',null);ss('after',null);ui.saving=false;
    var c=e&&e.code;
    ui.err=c==='conflict'?'Outra pessoa salvou uma versão ao mesmo tempo. A página vai recarregar com a versão mais nova; refaça a última alteração.':
      (c==='not_writer'||c==='not_granted')?'Esta conta não tem permissão para salvar. Abra o site com a conta que tem permissão de edição.':
      c==='too_big'?'O site ficou grande demais com tantas fotos. Remova algumas fotos antigas e tente de novo.':
      c==='unavailable'?'Não foi possível salvar nesta visualização. Abra o site pelo link do Claude com a conta que tem permissão de edição.':
      'Não foi possível salvar agora. Tente novamente em alguns segundos.';
    if(c==='not_writer'||c==='not_granted')caps.canEdit=false;
    render();window.scrollTo(0,0);
  }
}
function showToast(t){if(!t)return;var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},3200)}

/* ---------- render ---------- */
function render(){
  clearTimers();
  var r=route(),html;
  if(r==='admin')html=viewAdmin();
  else if(r==='personalizada')html=viewCustom();
  else{var e=findEx(r);html=e&&(e.status!=='rascunho'||authed())?viewDetail(e):viewHome()}
  app.innerHTML=html;
  if(r==='excursoes'||r==='contato'||r==='duvidas'){var t=document.getElementById(r==='excursoes'?'lista':r);if(t)t.scrollIntoView({behavior:RM?'auto':'smooth'})}
  startHero();syncWa();instPreview();
  if(ui.flip)landFlip();
}

/* ---------- events ---------- */
app.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='busca'){ui.q=t.value;var pos=t.selectionStart;render();var b=document.getElementById('busca');if(b){b.focus();try{b.setSelectionRange(pos,pos)}catch(e){}}return}
  if(/^(r|c)-/.test(t.id)){var w=t.closest('.field');if(w&&w.classList.contains('err')&&t.value.trim()){w.classList.remove('err');var m=w.querySelector('.errmsg');if(m)m.remove()}syncWa()}
  if(/^v-/.test(t.id))instPreview();
  if(t.id==='g-tot'){readDraft();var bb=document.getElementById('busbox-adm');if(bb)bb.innerHTML=busHtml(ui.draft,'adm');var ra=document.getElementById('rest-adm');if(ra)ra.textContent=Math.max(0,ui.draft.vagas.total-ui.draft.ocupadas.length)}
});
app.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.upload&&t.files&&t.files.length){addImages(t.dataset.upload,[].slice.call(t.files));t.value=''}
  if(/^(r|c)-/.test(t.id))syncWa();
});
app.addEventListener('pointermove',function(ev){
  if(RM||ev.pointerType!=='mouse')return;var c=ev.target.closest('.card');if(!c)return;
  var r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;
  c.classList.add('tilt');c.style.setProperty('--ry',((x-.5)*10).toFixed(2)+'deg');c.style.setProperty('--rx',((.5-y)*8).toFixed(2)+'deg');
  c.style.setProperty('--gx',(x*100).toFixed(1)+'%');c.style.setProperty('--gy',(y*100).toFixed(1)+'%');
});
app.addEventListener('pointerout',function(ev){var c=ev.target.closest('.card');if(c&&!c.contains(ev.relatedTarget)){c.classList.remove('tilt');c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
app.addEventListener('keydown',function(ev){if(ev.target.id==='dhero'&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();var r=ev.target.getBoundingClientRect();var e0=findEx(route());if(e0)openLightbox(e0.imagens,ui.img,e0.titulo,r.left+r.width/2,r.top+r.height/2)}});
app.addEventListener('click',function(ev){
  var hero=ev.target.closest('#dhero');
  if(hero){var e0=findEx(route());if(e0&&e0.imagens.length)openLightbox(e0.imagens,ui.img,e0.titulo,ev.clientX,ev.clientY);return}
  var t=ev.target.closest('button,a');if(!t)return;
  if(t.dataset.card&&!ev.metaKey&&!ev.ctrlKey&&!ev.shiftKey){
    var src=t.classList.contains('card')?t:(document.querySelector('.card[data-card="'+t.dataset.card+'"]')||null);
    var fl=src?flipFromCard(src):null;
    if(fl){ev.preventDefault();ui.flip=fl;var id=t.dataset.card;setTimeout(function(){location.hash='#'+id},180)}return}
  if(t.dataset.dot!=null){var st=document.getElementById('stage');if(st&&st._show)st._show(+t.dataset.dot);return}
  if(t.dataset.filter){ui.filter=t.dataset.filter;render();return}
  if(t.dataset.img!=null){swapHero(+t.dataset.img,t);return}
  if(t.dataset.hotelimg!=null){var e1=findEx(route());if(e1)openLightbox(e1.hotel.imagens,+t.dataset.hotelimg,e1.hotel.nome,ev.clientX,ev.clientY);return}
  if(t.dataset.idea){var dd=document.getElementById('c-dest');if(dd){dd.value=t.dataset.idea;if(dd.animate&&!RM)dd.animate([{transform:'scale(1.04)',boxShadow:'0 0 0 6px rgba(23,191,230,.35)'},{transform:'scale(1)',boxShadow:'0 0 0 0 rgba(23,191,230,0)'}],{duration:500});dd.dispatchEvent(new Event('input',{bubbles:true}))}return}
  if(t.dataset.seat){var n=+t.dataset.seat;
    if(route()==='admin'&&ui.draft){var o=ui.draft.ocupadas,k=o.indexOf(n);if(k>=0)o.splice(k,1);else o.push(n);t.classList.toggle('occ',k<0);t.setAttribute('aria-pressed',String(k<0));
      var ra=document.getElementById('rest-adm');if(ra)ra.textContent=Math.max(0,ui.draft.vagas.total-o.length);return}
    var s=ui.seats,j=s.indexOf(n);if(j>=0)s.splice(j,1);else s.push(n);t.classList.toggle('sel',j<0);t.setAttribute('aria-pressed',String(j<0));syncWa();return}
  if(t.id==='r-send'||t.id==='c-send'){var p=t.id[0];if(!validate(p)){ev.preventDefault();return}syncWa();return}
  if(t.dataset.copy){var p2=t.dataset.copy,txt=p2==='c'?customMsg():reservaMsg(findEx(route()));
    var done=function(){t.textContent='Copiado!';setTimeout(function(){t.textContent='Copiar mensagem'},1800)};
    try{navigator.clipboard.writeText(txt).then(done,function(){selectPrev(p2)})}catch(e){selectPrev(p2)}return}
  if(t.dataset.imgact){ev.preventDefault();readDraft();var key=t.dataset.key,arr=key==='main'?ui.draft.imagens:ui.draft.hotel.imagens,i=+t.dataset.i;
    if(t.dataset.imgact==='rm')arr.splice(i,1);else if(t.dataset.imgact==='left'){var x=arr[i];arr[i]=arr[i-1];arr[i-1]=x}else if(t.dataset.imgact==='cover'){arr.unshift(arr.splice(i,1)[0])}
    rerenderImgs(key);return}
  if(t.dataset.tab){ui.tab=t.dataset.tab;ui.err='';render();return}
  var act=t.dataset.act;if(!act)return;
  ev.preventDefault();
  if(act==='logout'){ss('adm',null);ui.draft=null;render();return}
  if(act==='cancel'){ui.confirm=null;render();return}
  if(act==='reset'){ui.confirm='reset';render();return}
  if(act==='reset-yes'){var n0=clone(S);n0.admin=null;ui.confirm=null;ss('adm',null);persist(n0,'Acesso apagado. Crie um novo login.','admin');return}
  if(act==='rm-logo'){var nl=clone(S);delete nl.config.logo;persist(nl,'Logo padrão restaurada.');return}
  if(act==='new'){ui.draft=blankEx();ui.err='';ss('draft',null);render();window.scrollTo(0,0);return}
  if(act==='edit'||act==='dup'){var srcE=findEx(t.dataset.id);if(!srcE)return;ui.draft=clone(srcE);if(!ui.draft.ocupadas)ui.draft.ocupadas=[];if(act==='dup'){ui.draft.id=uid();ui.draft.titulo+=' (cópia)';ui.draft.exemplo=false;ui.draft.status='rascunho';ui.draft.ocupadas=[]}ui.err='';render();window.scrollTo(0,0);return}
  if(act==='del'){ui.confirm='del:'+t.dataset.id;render();return}
  if(act==='del-yes'){var n2=clone(S);n2.excursoes=n2.excursoes.filter(function(e){return e.id!==t.dataset.id});ui.confirm=null;persist(n2,'Excursão apagada.');return}
  if(act==='clear-ex'){ui.confirm='clear-ex';render();return}
  if(act==='clear-ex-yes'){var n3=clone(S);n3.excursoes=n3.excursoes.filter(function(e){return !e.exemplo});ui.confirm=null;persist(n3,'Exemplos apagados.');return}
  if(act==='cancel-edit'){ui.draft=null;ui.err='';ss('draft',null);location.hash='#admin';render();return}
  if(act==='save-ex'){
    readDraft();var d2=ui.draft,miss=[];
    if(!d2.titulo)miss.push('nome da excursão');if(!d2.destino)miss.push('destino');if(!d2.ida.data)miss.push('data de ida');if(!d2.volta.data)miss.push('data de volta');if(!d2.valores.adulto)miss.push('valor por pessoa');
    if(miss.length){ui.err='Preencha: '+miss.join(', ')+'.';render();window.scrollTo(0,0);return}
    if(d2.volta.data<d2.ida.data){ui.err='A data de volta está antes da data de ida.';render();window.scrollTo(0,0);return}
    d2.exemplo=false;
    var n4=clone(S),idx=n4.excursoes.findIndex(function(e){return e.id===d2.id});if(idx>=0)n4.excursoes[idx]=clone(d2);else n4.excursoes.push(clone(d2));
    ss('draft',JSON.stringify(d2));
    persist(n4,idx>=0?'Alterações salvas.':'Excursão publicada.').then(function(){if(!ui.err){ui.draft=null;ss('draft',null);render()}});return}
  if(act==='change-pw'){changePw();return}
});
function selectPrev(p){var pv=document.getElementById(p+'-prev');if(!pv)return;var d=pv.closest('details');if(d)d.open=true;var r=document.createRange();r.selectNodeContents(pv);var s=getSelection();s.removeAllRanges();s.addRange(r)}
app.addEventListener('submit',async function(ev){
  ev.preventDefault();var f=ev.target;
  if(f.id==='f-reserva'||f.id==='f-custom'){var a=f.querySelector('.btn-wa[href]');if(a&&validate(f.id==='f-custom'?'c':'r'))a.click();return}
  if(f.id==='f-login'){
    var u=gv('l-user'),pw=document.getElementById('l-pw').value;
    if(!S.admin){
      var pw2=document.getElementById('l-pw2').value;
      if(u.length<3){ui.err='O login precisa ter pelo menos 3 caracteres.';render();return}
      if(pw.length<6){ui.err='A senha precisa ter pelo menos 6 caracteres.';render();return}
      if(pw!==pw2){ui.err='As duas senhas não são iguais.';render();return}
      var salt=Math.random().toString(36).slice(2)+Date.now().toString(36),hs=await hashPw(u,pw,salt);
      var n=clone(S);n.admin={login:u,salt:salt,hash:hs};ss('adm',hs);
      persist(n,'Acesso criado. Bem-vinda ao painel!','admin');return;
    }
    var hh=await hashPw(u,pw,S.admin.salt);
    if(hh===S.admin.hash&&u.toLowerCase()===String(S.admin.login).toLowerCase()){ss('adm',hh);ui.err='';render()}
    else{ui.err='Login ou senha incorretos.';render()}
    return;
  }
  if(f.id==='f-config'){
    var wa=gv('cf-wa').replace(/\D/g,'');
    if(wa&&(wa.length<10||wa.length>13)){ui.err='O WhatsApp deve ter DDD + número, ex.: (15) 99999-0000.';render();return}
    var n2=clone(S);
    Object.assign(n2.config,{nome:gv('cf-nome')||'Lunas Tour',subtitulo:gv('cf-sub'),cidade:gv('cf-cidade'),slogan:gv('cf-slogan'),apresentacao:gv('cf-apres'),whatsapp:gv('cf-wa'),instagram:gv('cf-ig'),embarque:gv('cf-emb'),sobre:gv('cf-sobre'),faq:textToFaq(document.getElementById('cf-faq').value)});
    persist(n2,'Configurações salvas.');return;
  }
});
async function changePw(){
  var u=gv('cf-login'),p=document.getElementById('cf-pw').value,p2=document.getElementById('cf-pw2').value;
  if(u.length<3){ui.err='O login precisa ter pelo menos 3 caracteres.';render();return}
  if(p.length<6){ui.err='A nova senha precisa ter pelo menos 6 caracteres.';render();return}
  if(p!==p2){ui.err='As duas senhas não são iguais.';render();return}
  var salt=Math.random().toString(36).slice(2)+Date.now().toString(36),hs=await hashPw(u,p,salt);
  var n=clone(S);n.admin={login:u,salt:salt,hash:hs};ss('adm',hs);persist(n,'Login e senha atualizados.');
}

/* ---------- boot ---------- */
try{var dr=ss('draft');if(dr&&route()==='admin'){ui.draft=JSON.parse(dr)}}catch(e){}
render();
var t0=ss('toast');if(t0){ss('toast',null);showToast(t0);if(ui.draft&&findEx(ui.draft.id)){ui.draft=null;ss('draft',null);render()}}
if(window.claude&&claude.use){
  claude.use('artifact').then(function(a){caps.artifact=a}).catch(function(){});
  claude.use('assets').then(function(a){caps.assets=a;if(route()==='admin')render()}).catch(function(){});
  claude.use('user').then(function(u){caps.user=u;if(u&&u.canEdit)return u.canEdit().then(function(v){caps.canEdit=v;if(route()==='admin')render()})}).catch(function(){});
}
})();
